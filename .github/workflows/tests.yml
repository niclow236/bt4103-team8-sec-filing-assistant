# Runs the whole test suite on every pull request and on every push to main.
# What the suite needs is in README.md, under "Getting started".
#
# One test reaches the network: it downloads the bge tokenizer from the Hugging
# Face Hub, unauthenticated, to check the table budget against the real encoder
# (#64). A runner that cannot download it fails that test rather than skipping
# it, so a Hub outage shows up as a red check rather than as 1 skipped.
name: tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request stops the run for the push before it, since only
# the branch's latest commit is going to be merged. A push to main stops
# nothing: every commit on main is tested on its own, so each one gets its own
# group, keyed by its SHA. Grouping main's pushes together would not do, even
# without cancel-in-progress: a queued run is cancelled when a newer one is
# queued behind it, so a burst of merges would leave the middle commits
# untested.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest, Python ${{ matrix.python-version }}
    # Pinned because the matrix includes Python 3.10; check that the
    # actions/python-versions manifest has a 3.10 build for Ubuntu 26.04
    # before moving this runner forward.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Let the other Python version finish, so one failure does not hide another.
      fail-fast: false
      matrix:
        # 3.10 is the oldest the README supports.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # sentence-transformers pulls in torch, and on Linux the default wheel
      # brings the CUDA libraries with it, a few gigabytes nothing here uses.
      # Installing the CPU build first means requirements.txt finds torch
      # already there.
      - name: Install torch, CPU build
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the suite
        run: python -m pytest
